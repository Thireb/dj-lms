<div class="grouped-checkboxes space-y-3"{% if widget.attrs.id %} id="{{ widget.attrs.id }}"{% endif %}>{% for group_name, options, index in widget.optgroups %}<fieldset class="rounded-lg border border-border p-3">{% if group_name %}<legend class="px-1 text-sm font-medium text-text">{{ group_name }}</legend>{% endif %}<div class="flex flex-wrap gap-x-4 gap-y-2">{% for option in options %}<label class="inline-flex items-center gap-2 text-sm text-text" for="{{ option.attrs.id }}"><input type="checkbox" name="{{ option.name }}" value="{{ option.value }}" id="{{ option.attrs.id }}"{% if option.selected %} checked{% endif %}>{{ option.label }}</label>{% endfor %}</div></fieldset>{% empty %}<p class="text-sm text-muted">{{ widget.empty_text }}</p>{% endfor %}</div>

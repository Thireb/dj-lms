{% load ui_icons %}<div class="grouped-checkboxes grid gap-3"{% if widget.attrs.id %} id="{{ widget.attrs.id }}"{% endif %}>{% for group_name, options, index in widget.optgroups %}<fieldset class="rounded-xl border border-border p-3.5">{% if group_name %}<legend class="float-left mb-2.5 w-full text-sm font-semibold text-text">{{ group_name }}</legend>{% endif %}<div class="clear-left flex flex-wrap gap-2">{% for option in options %}<label class="chip-toggle inline-flex h-9 cursor-pointer items-center gap-2 rounded-[9px] border border-border px-3 text-sm text-ink-2 transition-colors hover:border-border-strong has-[:checked]:border-primary has-[:checked]:bg-primary-50 has-[:checked]:font-semibold has-[:checked]:text-primary has-[:focus-visible]:outline has-[:focus-visible]:outline-3 has-[:focus-visible]:outline-accent/45" for="{{ option.attrs.id }}"><input type="checkbox" class="peer sr-only" name="{{ option.name }}" value="{{ option.value }}" id="{{ option.attrs.id }}"{% if option.selected %} checked{% endif %}>{% icon "check" "hidden h-3.5 w-3.5 peer-checked:block" %}{{ option.label }}</label>{% endfor %}</div></fieldset>{% empty %}<p class="text-sm text-muted">{{ widget.empty_text }}</p>{% endfor %}</div>

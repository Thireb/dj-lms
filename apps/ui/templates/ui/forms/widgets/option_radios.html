<div class="option-radios grid gap-2" role="radiogroup"{% if widget.group_label %} aria-label="{{ widget.group_label }}"{% endif %}{% if widget.attrs.id %} id="{{ widget.attrs.id }}"{% endif %}>{% for group_name, options, index in widget.optgroups %}{% for option in options %}<label class="flex min-h-11 cursor-pointer items-start gap-3 rounded-[10px] border border-border px-3 py-2.5 text-sm text-text transition-colors hover:border-border-strong has-[:checked]:border-primary has-[:checked]:bg-primary-50 has-[:focus-visible]:outline has-[:focus-visible]:outline-3 has-[:focus-visible]:outline-accent/45" for="{{ option.attrs.id }}"><input type="radio" class="mt-0.5 h-4 w-4 flex-none accent-primary" name="{{ option.name }}" value="{{ option.value }}" id="{{ option.attrs.id }}"{% if option.selected %} checked{% endif %}><span class="min-w-0 break-words">{{ option.label }}</span></label>{% endfor %}{% endfor %}</div>

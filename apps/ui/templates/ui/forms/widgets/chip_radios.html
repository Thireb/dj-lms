{% load ui_icons %}<div class="chip-radios flex flex-wrap gap-2" role="radiogroup"{% if widget.group_label %} aria-label="{{ widget.group_label }}"{% endif %}{% if widget.attrs.id %} id="{{ widget.attrs.id }}"{% endif %}>{% for group_name, options, index in widget.optgroups %}{% for option in options %}<label class="chip-toggle inline-flex h-9 cursor-pointer items-center gap-2 rounded-[9px] border border-border px-3 text-sm text-ink-2 transition-colors hover:border-border-strong has-[:checked]:border-primary has-[:checked]:bg-primary-50 has-[:checked]:font-semibold has-[:checked]:text-primary has-[:focus-visible]:outline has-[:focus-visible]:outline-3 has-[:focus-visible]:outline-accent/45" for="{{ option.attrs.id }}"><input type="radio" class="peer sr-only" name="{{ option.name }}" value="{{ option.value }}" id="{{ option.attrs.id }}"{% if option.selected %} checked{% endif %}>{% icon "check" "hidden h-3.5 w-3.5 peer-checked:block" %}{{ option.label }}</label>{% endfor %}{% endfor %}</div>

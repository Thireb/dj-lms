<section class="section min-w-0 grid gap-x-10 gap-y-4 {% if legend %}md:grid-cols-[15rem_minmax(0,1fr)]{% endif %} {{ css_class }}">
  {% if legend %}
    <div>
      <h3 id="{{ section_id }}" class="text-base font-semibold text-text">{{ legend }}</h3>
      {% if description %}<p class="mt-1 text-sm text-muted">{{ description }}</p>{% endif %}
    </div>
  {% endif %}
  <fieldset class="min-w-0 {% if columns == 2 %}grid items-start gap-x-4 md:grid-cols-2{% endif %}" {% if legend %}aria-labelledby="{{ section_id }}"{% endif %}>{% for part in field_parts %}{{ part }}{% endfor %}</fieldset>
</section>

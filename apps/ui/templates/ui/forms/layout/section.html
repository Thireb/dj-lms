<fieldset class="section min-w-0 rounded-[18px] border border-border bg-surface p-5 md:p-6 {{ css_class }}">
  {% if legend %}
    <legend class="float-left mb-4 w-full text-base font-semibold text-text">{{ legend }}</legend>
  {% endif %}
  <div class="clear-left">{% for part in field_parts %}{{ part }}{% endfor %}</div>
</fieldset>

{% if form.non_field_errors %}
  <div class="rounded-lg border border-danger bg-surface p-3 text-sm text-danger">
    {{ form.non_field_errors }}
  </div>
{% endif %}
{% for field in form %}
  {% include "ui/forms/field.html" %}
{% endfor %}
{% if not form.fields and form.errors %}
  {{ form.errors }}
{% endif %}

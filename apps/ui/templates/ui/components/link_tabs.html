<nav class="link-tabs -mb-px flex gap-1 overflow-x-auto border-b border-border" aria-label="{{ label }}">{% for tab in tabs %}<a href="{{ tab.url }}" class="inline-flex min-h-10 items-center whitespace-nowrap border-b-2 px-4 text-sm {% if tab.id == active %}border-primary font-semibold text-primary{% else %}border-transparent text-muted hover:text-text{% endif %}"{% if tab.id == active %} aria-current="page"{% endif %}>{{ tab.label }}</a>{% endfor %}</nav>

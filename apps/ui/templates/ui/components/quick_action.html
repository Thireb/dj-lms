{% if url %}<a href="{{ url }}" class="quick-action flex flex-col items-center gap-2 rounded-lg border border-border bg-surface p-4 text-center hover:bg-page"><i class="fa-solid fa-{{ icon }} text-xl text-primary" aria-hidden="true"></i><span class="text-sm font-medium">{{ label }}</span></a>{% else %}<div class="quick-action flex flex-col items-center gap-2 rounded-lg border border-border bg-surface p-4 text-center opacity-50" aria-disabled="true"><i class="fa-solid fa-{{ icon }} text-xl text-primary" aria-hidden="true"></i><span class="text-sm font-medium">{{ label }}</span></div>{% endif %}

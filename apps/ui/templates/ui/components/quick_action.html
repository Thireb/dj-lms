{% load ui_icons %}{% if url %}<a href="{{ url }}" class="quick-action flex items-center gap-3 rounded-2xl border border-border bg-surface p-4 text-sm font-semibold text-text transition-colors hover:border-primary/40 hover:text-primary"><span class="grid h-10 w-10 flex-none place-items-center rounded-xl bg-primary-50 text-primary">{% icon icon "h-5 w-5" %}</span>{{ label }}</a>{% else %}<div class="quick-action flex items-center gap-3 rounded-2xl border border-border bg-surface p-4 text-sm font-semibold text-muted opacity-60" aria-disabled="true"><span class="grid h-10 w-10 flex-none place-items-center rounded-xl bg-page">{% icon icon "h-5 w-5" %}</span>{{ label }}</div>{% endif %}

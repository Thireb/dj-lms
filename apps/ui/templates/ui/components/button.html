{% if url %}<a href="{{ url }}" class="btn btn-{{ variant }} inline-flex items-center gap-2 rounded-lg px-4 py-2 text-sm font-medium">{% else %}<button type="button" class="btn btn-{{ variant }} inline-flex items-center gap-2 rounded-lg px-4 py-2 text-sm font-medium">{% endif %}{% if icon %}<i class="fa-solid fa-{{ icon }}" aria-hidden="true"></i>{% endif %}{{ label }}{% if url %}</a>{% else %}</button>{% endif %}

{% load ui_icons %}<section class="section-card min-w-0 rounded-[18px] border border-border bg-surface"><div class="flex items-center gap-3 border-b border-border px-5 py-4">{% if icon %}<span class="grid h-[38px] w-[38px] flex-none place-items-center rounded-[11px] bg-primary-50 text-primary">{% icon icon %}</span>{% endif %}<h2 class="text-base font-semibold text-text">{{ title }}</h2>{% if link_url %}<a href="{{ link_url }}" class="ml-auto text-sm font-semibold text-primary hover:underline">{{ link_label }}</a>{% endif %}</div><div class="p-5">{{ body }}</div></section>

{% load ui_icons %}<div class="empty-state grid justify-items-center gap-2.5 px-4 text-center {% if framed %}rounded-[18px] border border-dashed border-border-strong bg-surface py-10{% else %}py-6{% endif %}"><span class="grid h-12 w-12 place-items-center rounded-[14px] bg-primary-50 text-primary">{% icon icon|default:"inbox" "h-5 w-5" %}</span><h3 class="text-base font-semibold text-text">{{ title }}</h3>{% if text %}<p class="max-w-sm text-sm text-muted">{{ text }}</p>{% endif %}{% if action %}<div class="mt-2">{{ action }}</div>{% endif %}</div>

<ol class="message-list grid gap-3">{% for row in rows %}<li class="flex{% if row.mine %} justify-end{% endif %}"><article class="max-w-[42rem] min-w-0 rounded-2xl border px-4 py-3{% if row.mine %} border-primary-100 bg-primary-50{% else %} border-border bg-surface{% endif %}"><header class="mb-1 flex flex-wrap items-baseline gap-x-2 text-xs text-muted"><span class="font-semibold text-text">{{ row.author }}</span><span>{{ row.when }}</span></header><div class="whitespace-pre-line break-words text-sm leading-relaxed text-text">{{ row.body }}</div></article></li>{% endfor %}</ol>

<div class="schedule-list">{% regroup lectures by day as day_groups %}{% for group in day_groups %}<section class="mb-4"><h3 class="text-sm font-semibold text-muted">{{ group.grouper }}</h3>{% for lecture in group.list %}<div class="lecture-item py-2 text-sm">{{ lecture.title }}</div>{% endfor %}</section>{% empty %}<p class="text-sm text-muted">No lectures scheduled.</p>{% endfor %}</div>

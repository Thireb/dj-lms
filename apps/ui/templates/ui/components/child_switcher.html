<form method="post" action="{{ url }}" class="child-switcher flex items-center gap-2">{% if csrf_token %}{% csrf_token %}{% endif %}<input type="hidden" name="next" value="{{ next_url }}"><label for="child-switcher" class="sr-only">Child</label><select name="child" id="child-switcher" class="field-control h-10 w-auto max-w-[8.5rem] py-0 text-sm sm:max-w-[14rem]" x-data @change="$el.form.requestSubmit()">{% for value, label in options %}<option value="{{ value }}"{% if value == chosen %} selected{% endif %}>{{ label }}</option>{% endfor %}</select><noscript><button type="submit" class="btn btn-secondary">Show</button></noscript></form>

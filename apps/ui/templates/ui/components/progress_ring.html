<svg class="progress-ring h-[76px] w-[76px] flex-none" viewBox="0 0 80 80" role="img" aria-label="{% if label %}{{ label }}: {% endif %}{{ value }}%"><circle cx="40" cy="40" r="{{ radius }}" fill="none" stroke-width="8" class="stroke-border"></circle><circle cx="40" cy="40" r="{{ radius }}" fill="none" stroke-width="8" stroke-linecap="round" stroke-dasharray="{{ dash }} {{ circumference }}" transform="rotate(-90 40 40)" class="{% if tone == 'indigo' %}stroke-indigo{% else %}stroke-primary{% endif %}"></circle><text x="40" y="45" text-anchor="middle" class="fill-text text-base font-bold">{{ value }}%</text></svg>

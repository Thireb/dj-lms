<nav class="pagination flex items-center gap-2 text-sm" aria-label="Pagination">{% if page_obj.has_previous %}<a href="?{% if query %}{{ query }}&{% endif %}page={{ page_obj.previous_page_number }}" class="rounded border border-border px-3 py-1">Previous</a>{% endif %}<span class="text-muted">Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span>{% if page_obj.has_next %}<a href="?{% if query %}{{ query }}&{% endif %}page={{ page_obj.next_page_number }}" class="rounded border border-border px-3 py-1">Next</a>{% endif %}</nav>

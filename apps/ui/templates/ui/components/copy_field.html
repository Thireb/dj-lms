<div class="copy-field grid gap-2" x-data="{ copied: false }">
  <label class="grid gap-1.5 text-sm font-semibold text-text">{{ label }}
    <input type="text" readonly x-ref="value" value="{{ value }}" class="field-control text-sm font-normal" @focus="$event.target.select()">
  </label>
  <button type="button" class="btn btn-primary justify-self-start" @click="navigator.clipboard.writeText($refs.value.value).then(() => copied = true, () => $refs.value.select())">
    <span x-show="!copied">Copy link</span><span x-show="copied" x-cloak>Copied</span>
  </button>
</div>

<div class="data-table min-w-0 md:overflow-x-auto md:rounded-[18px] md:border md:border-border md:bg-surface"><table class="min-w-full text-sm"><thead class="bg-page"><tr>{% for col in columns %}<th scope="col" class="border-b border-border px-4 py-3 text-left text-[13px] font-semibold text-muted">{{ col.label }}</th>{% endfor %}</tr></thead><tbody>{% if table_rows %}{% for row in table_rows %}<tr class="transition-colors md:border-b md:border-border md:last:border-b-0 md:hover:bg-primary-50/40">{% for label, key, cell in row %}<td class="px-4 py-3 align-middle cell-{{ key }}" data-label="{{ label }}">{{ cell }}</td>{% endfor %}</tr>{% endfor %}{% else %}<tr><td colspan="{{ columns|length }}" class="px-4 py-10 text-center text-muted" data-label="">{{ empty_title }}</td></tr>{% endif %}</tbody></table></div>

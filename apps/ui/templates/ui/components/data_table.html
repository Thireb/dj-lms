<div class="data-table overflow-x-auto rounded-lg border border-border"><table class="min-w-full text-sm"><thead class="bg-page text-xs text-muted"><tr>{% for col in columns %}<th class="px-4 py-3 text-left">{{ col.label }}</th>{% endfor %}</tr></thead><tbody>{% if cells %}{% for row_cells in cells %}<tr class="border-t border-border hover:bg-page">{% for cell in row_cells %}<td class="px-4 py-3">{{ cell }}</td>{% endfor %}</tr>{% endfor %}{% else %}<tr><td colspan="{{ columns|length }}" class="px-4 py-8 text-center text-muted">{{ empty_title }}</td></tr>{% endif %}</tbody></table></div>

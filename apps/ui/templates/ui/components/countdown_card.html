<div class="countdown-card flex flex-wrap items-center justify-between gap-4" x-data="countdownCard" data-scheduled-at="{{ scheduled_at_iso }}"{% if refresh_url %} hx-get="{{ refresh_url }}" hx-trigger="every 30s" hx-swap="outerHTML"{% endif %}>
  <div class="min-w-0">
    <h3 class="text-lg font-semibold break-words text-text">{{ title }}</h3>
    {% if when %}<p class="mt-0.5 text-sm text-ink-2">{{ when }}</p>{% endif %}
    {% if detail %}<p class="mt-0.5 text-sm break-words text-muted">{{ detail }}</p>{% endif %}
  </div>
  <div class="flex flex-wrap items-center gap-3">
    <p class="countdown text-lg font-semibold text-primary tabular-nums" x-text="remaining">--:--</p>
    {% if action %}{{ action }}{% endif %}
  </div>
</div>

{% if item.url %}<a href="{{ item.url }}"{% else %}<div{% endif %} class="calendar-item block min-w-0 rounded-lg border-l-2 px-2 py-1.5 text-xs {% if item.tone == 'success' %}border-success bg-success-50 text-text{% elif item.tone == 'danger' %}border-danger bg-danger-50 text-muted{% elif item.tone == 'neutral' %}border-border bg-page text-muted{% else %}border-primary bg-primary-50 text-text{% endif %}{% if item.url %} hover:ring-1 hover:ring-primary focus-visible:outline-2 focus-visible:outline-primary{% endif %}"><span class="block font-semibold">{{ item.time }}</span><span class="block break-words{% if item.tone == 'danger' %} line-through{% endif %}">{{ item.title }}</span>{% if item.detail and not compact %}<span class="block break-words text-muted">{{ item.detail }}</span>{% endif %}{% if item.status %}<span class="{% if compact %}sr-only{% else %}block text-muted{% endif %}">{{ item.status }}</span>{% endif %}{% if item.url %}</a>{% else %}</div>{% endif %}

{% load ui_icons %}<div class="stat-card tone-{{ tone }} rounded-2xl border p-4 {% if tone == 'lead' %}border-primary bg-primary text-white{% else %}border-border bg-surface{% endif %}">{% if icon %}<span class="mb-3 grid h-9 w-9 place-items-center rounded-[10px] {% if tone == 'lead' %}bg-white/15 text-white{% else %}bg-primary-50 text-primary{% endif %}">{% icon icon "h-[18px] w-[18px]" %}</span>{% endif %}<p class="text-[28px] leading-none font-bold tracking-tight {% if tone != 'lead' %}text-text{% endif %}">{{ value }}</p><p class="mt-1.5 text-sm {% if tone == 'lead' %}text-white/80{% else %}text-muted{% endif %}">{{ label }}</p>{% if note %}<p class="mt-0.5 text-[13px] {% if tone == 'lead' %}text-white/70{% else %}text-muted{% endif %}">{{ note }}</p>{% endif %}</div>

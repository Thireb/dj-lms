{% load ui_icons %}<form class="filter-bar flex flex-wrap items-end gap-2.5" method="get" role="search">{% for f in filters %}{% if f.options %}<label class="grid gap-1 text-[13px] font-semibold text-muted"><span>{{ f.label }}</span><select name="{{ f.name }}" class="h-10 min-w-[9rem] rounded-[10px] border border-border bg-surface px-3 text-sm font-normal text-text">{% for value, label in f.options %}<option value="{{ value }}"{% if value == f.value %} selected{% endif %}>{{ label }}</option>{% endfor %}</select></label>{% else %}<label class="grid min-w-0 flex-1 basis-60 gap-1 text-[13px] font-semibold text-muted sm:max-w-sm"><span>{{ f.label }}</span><span class="flex h-10 items-center gap-2 rounded-[10px] border border-border bg-surface px-3 focus-within:border-primary">{% icon "search" "h-4 w-4 text-muted" %}<input type="search" name="{{ f.name }}" value="{{ f.value|default:'' }}" class="h-full min-w-0 flex-1 bg-transparent text-sm font-normal text-text outline-none placeholder:text-muted" placeholder="{{ f.placeholder|default:'Name, ID, email or phone' }}" /></span></label>{% endif %}{% endfor %}<button type="submit" class="btn btn-secondary">Apply filters</button>{% if active %}<a href="?" class="btn btn-ghost">Clear</a>{% endif %}</form>

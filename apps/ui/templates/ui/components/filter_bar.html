<form class="filter-bar flex flex-wrap gap-3 rounded-lg border border-border bg-surface p-4" method="get">{% for f in filters %}<label class="text-sm"><span class="text-muted">{{ f.label }}</span>{% if f.options %}<select name="{{ f.name }}" class="mt-1 block rounded-lg border border-border px-3 py-1.5">{% for value, label in f.options %}<option value="{{ value }}"{% if value == f.value %} selected{% endif %}>{{ label }}</option>{% endfor %}</select>{% else %}<input type="text" name="{{ f.name }}" value="{{ f.value|default:'' }}" class="mt-1 block rounded-lg border border-border px-3 py-1.5" placeholder="{{ f.placeholder|default:'' }}" />{% endif %}</label>{% endfor %}<button type="submit" class="self-end rounded-lg bg-primary px-4 py-2 text-sm text-surface">Apply filters</button></form>

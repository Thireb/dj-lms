{% load ui_icons %}<nav class="top-nav min-w-0 md:flex-1" aria-label="Main" x-data="{ menuOpen: false }"><button type="button" class="menu-toggle icon-btn md:hidden" @click="menuOpen = !menuOpen" :aria-expanded="menuOpen.toString()" aria-expanded="false" aria-controls="top-nav-groups" aria-label="Menu">{% icon "menu" %}</button><ul id="top-nav-groups" class="hidden gap-0.5 md:flex max-md:absolute max-md:inset-x-0 max-md:top-16 max-md:max-h-[calc(100vh-4rem)] max-md:overflow-y-auto max-md:border-b max-md:border-border max-md:bg-surface max-md:p-3 max-md:shadow-[var(--shadow-pop)]" :class="menuOpen && 'max-md:block'">{% for group in groups %}<li class="relative" x-data="{ open: false }" @click.outside="open = false" @keydown.escape="open = false"><button type="button" class="nav-group flex h-10 w-full items-center justify-between gap-1.5 rounded-[10px] px-3 text-sm font-medium transition-colors {% if group.menu_key == active %}bg-primary-50 text-primary{% else %}text-ink-2 hover:bg-page hover:text-text{% endif %}" @click="open = !open" :aria-expanded="open.toString()" aria-expanded="false">{{ group.label }}{% icon "chevron-down" "h-3.5 w-3.5 transition-transform" %}</button><ul class="nav-group-items grid gap-0.5 p-1.5 md:absolute md:left-0 md:top-full md:z-40 md:mt-2 md:w-72 md:rounded-2xl md:border md:border-border md:bg-surface md:shadow-[var(--shadow-pop)]" x-show="open" x-cloak>{% for item in group.items %}<li>{% if item.post_only and not item.disabled %}<form method="post" action="{{ item.url }}">{% csrf_token %}<button type="submit" class="flex w-full items-center gap-3 rounded-[10px] p-2 text-left text-sm text-text hover:bg-page"><span class="grid h-8 w-8 flex-none place-items-center rounded-[9px] bg-primary-50 text-primary">{% icon item.icon "h-4 w-4" %}</span>{{ item.label }}</button></form>{% else %}<a href="{{ item.url }}" class="flex items-center gap-3 rounded-[10px] p-2 text-sm {% if item.disabled %}pointer-events-none text-muted opacity-60{% elif item.menu_key == active %}bg-primary-50 font-semibold text-primary{% else %}text-text hover:bg-page{% endif %}"{% if item.disabled %} aria-disabled="true" title="Coming in a later phase"{% endif %}><span class="grid h-8 w-8 flex-none place-items-center rounded-[9px] {% if item.disabled %}bg-page{% else %}bg-primary-50 text-primary{% endif %}">{% icon item.icon "h-4 w-4" %}</span>{{ item.label }}</a>{% endif %}</li>{% endfor %}</ul></li>{% endfor %}</ul></nav>

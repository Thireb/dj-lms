{% load ui_icons %}<nav class="top-nav min-w-0 xl:flex-1" aria-label="Main" x-data="{ menuOpen: false }"><button type="button" class="menu-toggle icon-btn xl:hidden" @click="menuOpen = !menuOpen" :aria-expanded="menuOpen.toString()" aria-expanded="false" aria-controls="top-nav-groups" aria-label="Menu">{% icon "menu" %}</button><ul id="top-nav-groups" class="hidden gap-0.5 xl:flex max-xl:absolute max-xl:inset-x-0 max-xl:top-16 max-xl:max-h-[calc(100vh-4rem)] max-xl:overflow-y-auto max-xl:border-b max-xl:border-border max-xl:bg-surface max-xl:p-3 max-xl:shadow-[var(--shadow-pop)]" :class="menuOpen && 'max-xl:block'">{% for group in groups %}<li class="relative" x-data="{ open: false }" @click.outside="open = false" @keydown.escape="open = false"><button type="button" class="nav-group flex h-10 w-full items-center whitespace-nowrap justify-between gap-1.5 rounded-[10px] px-3 text-sm font-medium transition-colors {% if group.menu_key == active %}bg-primary-50 text-primary{% else %}text-ink-2 hover:bg-page hover:text-text{% endif %}" @click="open = !open" :aria-expanded="open.toString()" aria-expanded="false">{{ group.label }}{% icon "chevron-down" "h-3.5 w-3.5 transition-transform" %}</button><ul class="nav-group-items grid gap-0.5 p-1.5 xl:absolute xl:left-0 xl:top-full xl:z-40 xl:mt-2 xl:w-72 xl:rounded-2xl xl:border xl:border-border xl:bg-surface xl:shadow-[var(--shadow-pop)]" x-show="open" x-cloak>{% for item in group.items %}<li>{% if item.post_only and not item.disabled %}<form method="post" action="{{ item.url }}">{% csrf_token %}<button type="submit" class="flex w-full items-center gap-3 rounded-[10px] p-2 text-left text-sm text-text hover:bg-page"><span class="grid h-8 w-8 flex-none place-items-center rounded-[9px] bg-primary-50 text-primary">{% icon item.icon "h-4 w-4" %}</span>{{ item.label }}</button></form>{% else %}<a href="{{ item.url }}" class="flex items-center gap-3 rounded-[10px] p-2 text-sm {% if item.disabled %}pointer-events-none text-muted opacity-60{% elif item.menu_key == active %}bg-primary-50 font-semibold text-primary{% else %}text-text hover:bg-page{% endif %}"{% if item.disabled %} aria-disabled="true" title="Coming in a later phase"{% endif %}><span class="grid h-8 w-8 flex-none place-items-center rounded-[9px] {% if item.disabled %}bg-page{% else %}bg-primary-50 text-primary{% endif %}">{% icon item.icon "h-4 w-4" %}</span>{{ item.label }}</a>{% endif %}</li>{% endfor %}</ul></li>{% endfor %}</ul></nav>

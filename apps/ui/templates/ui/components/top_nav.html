<nav class="top-nav min-w-0 bg-nav-dark text-surface" aria-label="Main" x-data="{ menuOpen: false }"><button type="button" class="menu-toggle my-2 rounded-lg px-3 py-1.5 text-sm hover:bg-primary/20 md:hidden" @click="menuOpen = !menuOpen" :aria-expanded="menuOpen.toString()" aria-expanded="false" aria-controls="top-nav-groups"><i class="fa-solid fa-bars mr-1" aria-hidden="true"></i>Menu</button><ul id="top-nav-groups" class="hidden flex-wrap gap-1 px-2 py-2 md:flex" :class="menuOpen && 'max-md:block'">{% for group in groups %}<li class="relative" x-data="{ open: false }" @click.outside="open = false" @keydown.escape="open = false"><button type="button" class="nav-group flex w-full items-center justify-between gap-1 rounded-lg px-3 py-1.5 text-sm font-medium hover:bg-primary/20 {% if group.menu_key == active %}text-accent{% endif %}" @click="open = !open" :aria-expanded="open.toString()" aria-expanded="false">{{ group.label }}<i class="fa-solid fa-chevron-down text-xs" aria-hidden="true"></i></button><ul class="nav-group-items py-1 md:absolute md:left-0 md:top-full md:z-20 md:mt-1 md:min-w-[14rem] md:rounded-lg md:bg-nav-dark md:shadow-lg" x-show="open" x-cloak>{% for item in group.items %}<li>{% if item.post_only and not item.disabled %}<form method="post" action="{{ item.url }}" class="inline">{% csrf_token %}<button type="submit" class="block w-full px-3 py-1.5 text-left text-sm hover:text-accent"><i class="fa-solid fa-{{ item.icon }} mr-1" aria-hidden="true"></i>{{ item.label }}</button></form>{% else %}<a href="{{ item.url }}" class="block px-3 py-1.5 text-sm {% if item.disabled %}pointer-events-none opacity-50{% elif item.menu_key == active %}text-accent{% endif %}"{% if item.disabled %} aria-disabled="true"{% endif %}><i class="fa-solid fa-{{ item.icon }} mr-1" aria-hidden="true"></i>{{ item.label }}</a>{% endif %}</li>{% endfor %}</ul></li>{% endfor %}</ul></nav>

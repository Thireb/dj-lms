<nav class="top-nav bg-nav-dark text-surface" aria-label="Main"><ul class="flex flex-wrap gap-4 px-4 py-3">{% for group in groups %}<li class="relative"><span class="text-sm font-medium {% if group.menu_key == active %}text-accent{% endif %}">{{ group.label }}</span><ul class="mt-1">{% for item in group.items %}<li><a href="{{ item.url }}" class="block px-2 py-1 text-sm {% if item.disabled %}pointer-events-none opacity-50{% elif item.menu_key == active %}text-accent{% endif %}"{% if item.disabled %} aria-disabled="true"{% endif %}><i class="fa-solid fa-{{ item.icon }} mr-1" aria-hidden="true"></i>{{ item.label }}</a></li>{% endfor %}</ul></li>{% endfor %}</ul></nav>

<div class="tabs flex gap-1 border-b border-border" role="tablist">{% for tab in tabs %}<button type="button" class="tab px-4 py-2 text-sm {% if tab.id == active %}border-b-2 border-primary font-semibold text-primary{% else %}text-muted{% endif %}" hx-get="{{ tab.url }}" hx-target="#tab-panel" hx-swap="innerHTML">{{ tab.label }}</button>{% endfor %}</div><div id="tab-panel" class="mt-4"></div>

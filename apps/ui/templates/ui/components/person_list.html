<div class="person-list">{% if title %}<p class="text-[13px] font-semibold text-muted">{{ title }}</p>{% endif %}{% if rows %}<ul class="mt-1 divide-y divide-border">{% for person, trailing in rows %}<li class="flex items-center justify-between gap-3 py-3">{{ person }}{% if trailing %}<span class="flex-none">{{ trailing }}</span>{% endif %}</li>{% endfor %}</ul>{% else %}<p class="mt-2 text-sm text-muted">{{ empty_text }}</p>{% endif %}</div>

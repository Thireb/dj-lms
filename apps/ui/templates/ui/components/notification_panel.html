<div class="notification-panel"><div class="flex items-center justify-between gap-3 border-b border-border px-4 py-3"><p class="text-sm font-semibold text-text">Notifications</p>{% if rows %}<form method="post" action="{{ read_all_url }}">{% if csrf_token %}{% csrf_token %}{% endif %}<input type="hidden" name="next" value="{{ next_url }}"><button type="submit" class="min-h-8 text-sm font-medium text-primary hover:underline">Mark all as read</button></form>{% endif %}</div>{% if rows %}<ul class="max-h-[60vh] overflow-y-auto">{% for row in rows %}<li class="border-b border-border last:border-b-0"><form method="post" action="{{ row.open_url }}">{% if csrf_token %}{% csrf_token %}{% endif %}<button type="submit" class="notification-row flex w-full items-start gap-3 px-4 py-3 text-left hover:bg-page{% if not row.is_read %} bg-primary-50{% endif %}"><span class="mt-1.5 h-2 w-2 flex-none rounded-full{% if not row.is_read %} bg-primary{% endif %}" aria-hidden="true"></span><span class="min-w-0 flex-1"><span class="block break-words text-sm text-text{% if not row.is_read %} font-semibold{% endif %}">{% if not row.is_read %}<span class="sr-only">Unread: </span>{% endif %}{{ row.text }}</span><span class="mt-0.5 block text-xs text-muted">{{ row.when }}</span></span></button></form></li>{% endfor %}</ul>{% else %}<p class="px-4 py-6 text-center text-sm text-muted">No notifications yet.</p>{% endif %}<div class="border-t border-border px-4 py-3"><a href="{{ list_url }}" class="text-sm font-medium text-primary hover:underline">See all notifications</a></div></div>

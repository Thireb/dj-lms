{% load ui_icons %}<div class="profile-menu relative" x-data="{ open: false }" @click.outside="open = false" @keydown.escape="open = false">
  <button type="button" class="flex h-10 items-center gap-2.5 rounded-full border border-border bg-surface py-1 pl-1 pr-3 text-left transition-colors hover:border-border-strong" @click="open = !open" aria-haspopup="true" :aria-expanded="open.toString()" aria-expanded="false" aria-label="Account menu">
    <span class="grid h-8 w-8 flex-none place-items-center rounded-full bg-primary-50 text-xs font-bold text-primary" aria-hidden="true">{{ badge.initials }}</span>
    <span class="hidden leading-tight sm:block"><span class="block max-w-[11rem] truncate text-sm font-semibold text-text">{{ badge.name }}</span>{% if badge.role %}<span class="block text-xs text-muted">{{ badge.role }}</span>{% endif %}</span>
    {% icon "chevron-down" "h-3.5 w-3.5 text-muted" %}
  </button>
  <ul x-show="open" x-cloak class="absolute right-0 z-40 mt-2 grid w-64 gap-0.5 rounded-2xl border border-border bg-surface p-1.5 text-text shadow-[var(--shadow-pop)]">
    {% for item in items %}
      <li>
        {% if item.post_only and not item.disabled %}
          <form method="post" action="{{ item.url }}">
            {% csrf_token %}
            <button type="submit" class="flex w-full items-center gap-3 rounded-[10px] px-2.5 py-2 text-left text-sm hover:bg-page">{% icon item.icon "h-4 w-4 text-muted" %}{{ item.label }}</button>
          </form>
        {% else %}
          <a href="{{ item.url }}" class="flex items-center gap-3 rounded-[10px] px-2.5 py-2 text-sm {% if item.disabled %}pointer-events-none text-muted opacity-60{% else %}hover:bg-page{% endif %}" {% if item.disabled %}aria-disabled="true"{% endif %}>{% icon item.icon "h-4 w-4 text-muted" %}{{ item.label }}</a>
        {% endif %}
      </li>
    {% endfor %}
  </ul>
</div>

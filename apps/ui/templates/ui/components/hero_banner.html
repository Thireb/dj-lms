<section class="hero-banner band rounded-[24px] p-6 md:p-7">{% include "ui/components/_waves.html" %}<div class="relative"><h2 class="text-2xl font-bold text-white md:text-[28px]">{{ title }}</h2>{% if subtitle %}<p class="mt-1 text-white/80">{{ subtitle }}</p>{% endif %}{% if chips %}<div class="mt-4 flex flex-wrap gap-2">{% for chip in chips %}<span class="inline-flex h-7 items-center rounded-lg border border-white/20 bg-white/10 px-2.5 text-[13px] font-medium">{{ chip }}</span>{% endfor %}</div>{% endif %}{% if actions %}<div class="mt-5 flex flex-wrap gap-2">{% for action in actions %}{{ action }}{% endfor %}</div>{% endif %}</div></section>

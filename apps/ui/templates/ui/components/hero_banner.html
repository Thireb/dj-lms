<section class="hero-banner rounded-lg bg-primary p-6 text-surface"><h2 class="text-xl font-semibold">{{ title }}</h2>{% if subtitle %}<p class="mt-1 text-sm opacity-90">{{ subtitle }}</p>{% endif %}{% if chips %}<div class="mt-3 flex flex-wrap gap-2">{% for chip in chips %}<span class="rounded-full bg-surface/20 px-2 py-0.5 text-xs">{{ chip }}</span>{% endfor %}</div>{% endif %}{% if actions %}<div class="mt-4 flex gap-2">{% for action in actions %}{{ action }}{% endfor %}</div>{% endif %}</section>

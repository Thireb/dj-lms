<aside class="sidebar w-56 bg-sidebar-dark text-surface" aria-label="Sidebar">{% for group in groups %}<div class="px-3 py-2"><p class="text-xs uppercase text-muted">{{ group.label }}</p><ul class="mt-1">{% for item in group.items %}<li><a href="{{ item.url }}" class="block rounded px-2 py-1.5 text-sm {% if item.disabled %}pointer-events-none opacity-50{% elif item.menu_key == active %}bg-primary text-surface{% endif %}"{% if item.disabled %} aria-disabled="true"{% endif %}><i class="fa-solid fa-{{ item.icon }} mr-2 w-4" aria-hidden="true"></i>{{ item.label }}</a></li>{% endfor %}</ul></div>{% endfor %}</aside>

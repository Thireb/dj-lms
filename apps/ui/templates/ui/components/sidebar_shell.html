{% extends "ui/layouts/app_shell.html" %}{% block shell_sidebar %}<div id="portal-sidebar" class="sidebar-wrap hidden md:block" :class="navOpen && 'max-md:fixed max-md:inset-0 max-md:z-30 max-md:flex'"><div class="h-full overflow-y-auto">{{ sidebar }}</div><button type="button" class="flex-1 bg-text/40 md:hidden" @click="navOpen = false" aria-label="Close menu"></button></div>{% endblock %}{% block shell_header %}<div class="sidebar-shell-header flex items-center justify-between gap-4 border-b border-border bg-surface px-4 py-2"><button type="button" class="menu-toggle rounded-lg border border-border px-3 py-1.5 text-sm text-text md:invisible" @click="navOpen = !navOpen" :aria-expanded="navOpen.toString()" aria-expanded="false" aria-controls="portal-sidebar"><i class="fa-solid fa-bars mr-1" aria-hidden="true"></i>Menu</button>{{ notification_bell }}</div>{% endblock %}{% block shell_content %}<div class="sidebar-shell-content">{% for toast in toasts %}<div class="mb-4">{{ toast }}</div>{% endfor %}{{ content|default:"" }}</div>{% endblock %}

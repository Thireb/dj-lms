<button type="button" class="notification-bell relative rounded-lg p-2 hover:bg-page" aria-label="Notifications"><i class="fa-regular fa-bell" aria-hidden="true"></i>{% if unread_count %}<span class="absolute -right-0.5 -top-0.5 flex h-4 w-4 items-center justify-center rounded-full bg-danger text-[10px] text-surface">{{ unread_count }}</span>{% endif %}</button>

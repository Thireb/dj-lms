{% load ui_icons %}{% if enabled %}<div class="notification-bell-wrap relative" x-data="{ open: false }" @keydown.escape="open = false" @click.outside="open = false"><a href="{{ list_url }}" class="notification-bell icon-btn" aria-haspopup="true" aria-controls="notification-panel" aria-expanded="false" :aria-expanded="open.toString()" @click.prevent="open = !open; if (open) htmx.trigger($refs.panel, 'bell-open')">{% icon "bell" %}<span class="notification-count" hx-get="{{ count_url }}" hx-trigger="load, every 60s" hx-swap="innerHTML">{{ count }}</span></a><div id="notification-panel" x-ref="panel" x-show="open" x-cloak class="fixed inset-x-4 top-[4.5rem] z-50 overflow-hidden sm:absolute sm:inset-x-auto sm:right-0 sm:top-full sm:mt-2 sm:w-[22rem] rounded-2xl border border-border bg-surface shadow-[var(--shadow-pop)]" hx-get="{{ panel_url }}" hx-trigger="bell-open" hx-swap="innerHTML"><p class="px-4 py-3 text-sm text-muted">Loading notifications</p></div></div>{% endif %}
